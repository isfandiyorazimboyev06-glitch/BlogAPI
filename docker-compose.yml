services:
  postgres:
    image: postgres:15-alpine
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: blog_usr
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: blog_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol port (used by Laravel)
      - "15672:15672" # Web Management UI (used by YOU in your browser!)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    

  s3mock:
    image: adobe/s3mock:latest
    container_name: blog_s3
    restart: always
    ports:
      - "9090:9090"
    environment:
      - initialBuckets=blogapi-excel-reports
      - retainFilesOnExit=true
      - root=/data
    volumes:
      - s3_data:/data

  redis:
    image: redis:7-alpine
    container_name: blog_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: blog_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=cache:redis:6379:1,default:redis:6379:0
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  pgdata:
  rabbitmq_data:
  redis_data:
  s3_data: